# Codemagic ビルド設定（平凡投票 / Capacitor iOS）
# ------------------------------------------------------------------
# 目的: Macを持たずに、クラウド(macOS)上で iOS アプリをビルド→署名→
#       App Store Connect / TestFlight へアップロードする。
#
# ★これは"雛形"です。以下の【TODO】は Apple Developer が有効化され、
#   App Store Connect でアプリを作成した"後"に埋めます（今は未確定のため空欄）。
#
# 使う前提（Apple有効化後に Codemagic の管理画面でやること）:
#   1. Codemagic に GitHub でサインアップ → このリポジトリを接続
#   2. App Store Connect で「App Store Connect API キー」を発行
#      （Users and Access → Integrations → App Store Connect API）
#   3. Codemagic の Team settings → Integrations → App Store Connect に
#      その API キーを登録し、名前をつける（下の <APP_STORE_CONNECT_KEY> に使う）
#   4. Codemagic の環境変数に APP_STORE_APPLE_ID（アプリ作成後に決まる数値ID）を設定
# ------------------------------------------------------------------

workflows:
  ios-release:
    name: 平凡投票 iOS Release
    instance_type: mac_mini_m2      # CodemagicのmacOSマシン（無料枠対象）
    max_build_duration: 60

    integrations:
      # CodemagicのDeveloper Portal連携に登録したApp Store Connect APIキーの名前(2026-08-18設定)
      app_store_connect: heibon-vote-asc

    environment:
      # ios_signing ブロックは意図的に置かない(2026-08-21)。
      # これを書くとCodemagicがスクリプト実行前の準備段階で「自動署名」を走らせ、
      # プロファイルが無い時点で "No matching profiles found ..." で即失敗し、
      # 下の Set up code signing ステップまで到達しない。
      # APIキー(integrations)経由の手動署名に一本化し、--create で作らせる。
      # Codemagicのアプリ設定に登録した環境変数グループを読み込む。
      # このグループに CERTIFICATE_PRIVATE_KEY(2048bit RSA秘密鍵, secure)が入っている。
      # fetch-signing-files --create は証明書を新規作成する際にこの鍵を使う。
      # 未設定だと "Cannot save Signing Certificates without certificate private key"
      # で落ちる(2026-08-21に踏んだ)。鍵の実体はリポジトリに置かない。
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.moka0502.heibonvote"
        # App Store Connectでアプリ「平凡投票」を作成して付いた数値のApple ID(2026-08-18設定)
        APP_STORE_APPLE_ID: "6802689228"
      # Capacitor 8系のCLIは Node >=22 を要求する(2026-08-21: node 20指定で
      # "The Capacitor CLI requires NodeJS >=22.0.0" によりcap syncが失敗した)。
      # ローカルのdevcontainerは node 20 のままだが、ios/はCIでのみ生成するため影響しない。
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Generate & sync iOS project
        # ios/ フォルダはリポジトリに含めず、ビルド時にCapacitorで生成する
        # （cap add ios はmacOS/Xcodeが要るためCI(mac)で実行）。
        #
        # 以前は `npx cap add ios || true` と書いていたが、これは生成失敗を握りつぶし、
        # 何も出来ていないのに1秒で「成功」扱いのまま後続へ進み、遠く離れた Build IPA で
        # "App.xcworkspace does not exist" として初めて露見していた(2026-08-21)。
        # 失敗はその場で落とす(fail loudly)。ios/ は毎回クリーンな状態から作るので
        # cap add が既存ディレクトリで失敗することはない。
        script: |
          set -eux
          npx cap add ios
          npx cap sync ios
          # Capacitor 8 は CocoaPods ではなく Swift Package Manager を使う
          # (ログに "Writing Package.swift" が出る)。よって Podfile も .xcworkspace も
          # 生成されない。pod install を呼ぶと "No `Podfile' found" で落ちる(2026-08-21に踏んだ)。
          # 生成物を可視化しておく(次に壊れたとき原因がすぐ分かるように)
          ls -la ios/App

      - name: iPhone のみ対応にする
        # Capacitor が生成する iOS プロジェクトは既定で iPhone+iPad 対応(1,2)。
        # iPad 対応のままだと App Store Connect で iPad 用スクリーンショットも必須になり、
        # iPad での表示崩れも審査対象になるため、初回リリースは iPhone のみ(1)に絞る。
        # iPad も出したくなったら、この step を消して iPad スクリーンショットを用意する。
        script: |
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' \
            ios/App/App.xcodeproj/project.pbxproj
          grep -n TARGETED_DEVICE_FAMILY ios/App/App.xcodeproj/project.pbxproj

      - name: 暗号化の輸出コンプライアンスをInfo.plistで宣言する
        # これが無いと、ビルドをアップロードするたびにApp Store Connect上で
        # 「コンプライアンスがありません」となり、暗号化の質問に手で答える必要がある
        # (2026-08-21に実際に踏んだ。Apple自身が画面でこのキーの明記を案内している)。
        # このアプリはHTTPS(iOS標準の通信機能)を使うだけで暗号化を自前実装していないため
        # 免除対象＝false。ios/は毎回新規生成されるのでキーは必ず存在しない→insertで確実に入る。
        script: |
          set -eux
          plutil -insert ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist
          plutil -p ios/App/App/Info.plist | grep ITSAppUsesNonExemptEncryption

      - name: Set up code signing
        # xcode-project use-profiles は「取得済みのプロファイルを適用する」だけで、
        # プロファイルの取得・作成はしない。初回ビルドはプロファイルが存在せず
        # "No matching profiles found for bundle identifier ..." で落ちたため(2026-08-21)、
        # App Store Connect APIキー経由で明示的に取得し、不足分は --create で作らせる。
        script: |
          set -eux
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          # 取得できたプロファイルを可視化(空なら fetch 側の問題と即断できる)
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
          # 適用先のプロジェクトを明示する。既定のグロブ探索に任せると
          # プロジェクトを見つけられず、適用されないまま素通りして
          # Build IPA で "requires a provisioning profile" として露見する(2026-08-21)。
          xcode-project use-profiles --project "ios/App/App.xcodeproj"

      - name: Set build number
        # TestFlightの最新ビルド番号+1を採番（重複を防ぐ）
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true      # まずTestFlightへ（審査提出は慣れてから手動でもOK）
        # submit_to_app_store: false     # App Store審査に自動提出したくなったらtrueに
